plugins {
    id 'com.android.application'
}

android {
    namespace 'org.opengothic.app'
    compileSdk 35
    ndkVersion '27.0.12077973'

    defaultConfig {
        applicationId 'org.opengothic.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1-android'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++20', '-fvisibility=hidden', '-ffunction-sections', '-fdata-sections'
                arguments '-DANDROID_STL=c++_static',
                          '-DBUILD_SHARED_LIBS=OFF',
                          '-DTEMPEST_BUILD_DIRECTX12=OFF',
                          '-DTEMPEST_BUILD_METAL=OFF',
                          '-DTEMPEST_BUILD_VULKAN=ON',
                          '-DTEMPEST_BUILD_AUDIO=ON'
                targets 'Gothic2Notr'
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
            ndk.debugSymbolLevel 'FULL'
            externalNativeBuild.cmake.arguments '-DCMAKE_BUILD_TYPE=RelWithDebInfo'
        }
        release {
            minifyEnabled false
            ndk.debugSymbolLevel 'SYMBOL_TABLE'
            externalNativeBuild.cmake.arguments '-DCMAKE_BUILD_TYPE=Release'
        }
    }

    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
            version '3.22.1'
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    lint {
        disable 'ChromeOsAbiSupport'
    }
}
