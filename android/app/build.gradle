plugins {
    id 'com.android.application'
}

// Incrementally rewriting a multi-gigabyte APK can overflow the packager's offsets.
// Repackage APKs in full while preserving native compilation caches.
// This also removes orphaned private bytes when returning to an asset-free APK.
tasks.configureEach {
    if (name == 'packageDebug' || name == 'packageRelease') {
        outputs.upToDateWhen { false }
    }
}

def distributionKeystore = providers.environmentVariable('OPENGOTHIC_KEYSTORE').orNull
def distributionAlias = providers.environmentVariable('OPENGOTHIC_KEY_ALIAS').orNull
def distributionStorePassword = providers.environmentVariable('OPENGOTHIC_STORE_PASSWORD').orNull
def distributionKeyPassword = providers.environmentVariable('OPENGOTHIC_KEY_PASSWORD').orNull
if ([distributionKeystore, distributionAlias, distributionStorePassword, distributionKeyPassword].any { it != null } &&
    [distributionKeystore, distributionAlias, distributionStorePassword, distributionKeyPassword].any { !it }) {
    throw new GradleException('Set all four OPENGOTHIC signing environment variables, or leave all unset for local signing.')
}

android {
    namespace 'org.opengothic.app'
    compileSdk 35
    buildToolsVersion '35.0.0'
    ndkVersion '27.0.12077973'

    defaultConfig {
        applicationId 'org.opengothic.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1-android'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++20', '-fvisibility=hidden', '-ffunction-sections', '-fdata-sections'
                arguments '-DANDROID_STL=c++_static',
                          '-DBUILD_SHARED_LIBS=OFF',
                          '-DTEMPEST_BUILD_DIRECTX12=OFF',
                          '-DTEMPEST_BUILD_METAL=OFF',
                          '-DTEMPEST_BUILD_VULKAN=ON',
                          '-DTEMPEST_BUILD_AUDIO=ON'
                targets 'Gothic2Notr'
            }
        }
    }

    signingConfigs {
        if (distributionKeystore != null) {
            distribution {
                storeFile file(distributionKeystore)
                keyAlias distributionAlias
                storePassword distributionStorePassword
                keyPassword distributionKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
            ndk.debugSymbolLevel 'FULL'
            externalNativeBuild.cmake.arguments '-DCMAKE_BUILD_TYPE=RelWithDebInfo'
        }
        release {
            debuggable false
            jniDebuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Reuse the local key for in-place testing unless a distribution key is supplied.
            signingConfig distributionKeystore != null ? signingConfigs.distribution : signingConfigs.debug
            ndk.debugSymbolLevel 'FULL'
            externalNativeBuild.cmake.arguments '-DCMAKE_BUILD_TYPE=Release'
        }
    }

    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
            version '3.22.1'
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    sourceSets {
        main.java.srcDir file('../../lib/Tempest/Engine/system/android/java')
        // Only the guided private build supplies this property.
        // A normal build must never pick up a previous private package.
        if (providers.gradleProperty('privateGameAssets').isPresent()) {
            main.assets.srcDir file(providers.gradleProperty('privateGameAssets').get())
        }
    }

    androidResources {
        noCompress += ['zip', 'ogpart']
    }

    lint {
        disable 'ChromeOsAbiSupport'
    }
}
